<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmblemCon Panel Overlay</title>
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/main.css">
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js"
            }
        }
    </script>
    <script defer src="js/main.js"></script>
    <script defer type="module" src="js/modules/apps.js"></script>
</head>
<body>
    <section id="top-area" class="grid-con">
        <div id="questions" class="col-span-full">
            <p id="left-arrow" class="arrow"><</p>
            <p id="question"></p>
            <p id="right-arrow" class="arrow">></p>
        </div>
    </section>

    <section id="main-area" class="grid-con">
        <div id="hostess-area" class="col-span-full m-col-span-5"></div>

        <div id="player-area" class= "col-span-full m-col-start-6 m-col-span-7">
            <div id="player1" class="player">
                <div id="ducessa-image" class="player-image"></div>
                <p class="name">Ducessa</p>
                <div class="point-area">
                    <button @click="subtractCount1">-</button>
                    <p class="points">Points: {{count1}}</p>
                    <button @click="addToCount1">+</button>
                </div>
            </div>

            <div id="player2" class="player">
                <div id="okke-image" class="player-image"></div>
                <p class="name">Okke</p>
                <div class="point-area">
                    <button @click="subtractCount2">-</button>
                    <p class="points">Points: {{count2}}</p>
                    <button @click="addToCount2">+</button>
                </div>
            </div>

            <div id="player3" class="player">
                <div id="mysti-image" class="player-image"></div>
                <p class="name">Mysti</p>
                <div class="point-area">
                    <button @click="subtractCount3">-</button>
                    <p class="points">Points: {{count3}}</p>
                    <button @click="addToCount3">+</button>
                </div>
            </div>

            <div id="player4" class="player">
                <div id="daniel-image" class="player-image"></div>
                <p class="name">Daniel</p>
                <div class="point-area">
                    <button @click="subtractCount4">-</button>
                    <p class="points">Points: {{count4}}</p>
                    <button @click="addToCount4">+</button>
                </div>
            </div>

            <div id="player5" class="player">
                <div id="z-image" class="player-image"></div>
                <p class="name">Z</p>
                <div class="point-area">
                    <button @click="subtractCount5">-</button>
                    <p class="points">Points: {{count5}}</p>
                    <button @click="addToCount5">+</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
